<!-- The shop_report html -->

<h2 class="text-center">{%= Shop Report" %}</h2>
<h3>hello</h3>
{% if(filters.customer) { %}
<h4 class="text-center">{%=Customer%}: {%= filters.customer %}</h4>
{% } %}

<table class="table table-bordered">
    <thead>
        <tr>
            <th>{%= Customer"%}</th>
            <th>{%= Product Category %}</th>
            <th class="text-right">{%= Price%}</th>
        </tr>
    </thead>
    <tbody>
        {% for(var i=0, l=data.length; i<l; i++) { %}
        <tr>
            <td>{%= data[i].customer %}</td>
            <td>{%= data[i].product_category %}</td>
            <td class="text-right">{%= format_money(data[i].unit_price) %}</td>
        </tr>
        {% } %}
    </tbody>
</table>
